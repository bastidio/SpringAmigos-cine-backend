<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:12px;background-color:#211830;border:1px solid #2a2138;border-radius:12px;">
    <tr>
        <td style="padding:16px 20px;">
            <p style="margin:0;font-size:12px;color:#a89cb0;">Butaca</p>
            <p style="margin:4px 0 0;font-family:Georgia, 'Times New Roman', serif;font-size:26px;font-weight:bold;color:#d9b76a;">{{butaca}}</p>
            <p style="margin:4px 0 0;font-size:12px;color:#a89cb0;">Entrada #{{numeroEntrada}} · {{precio}}</p>
        </td>
        <td align="right" style="padding:12px 16px;">
            <img src="cid:qr{{numeroEntrada}}" alt="QR de la entrada {{butaca}}" width="110" height="110" style="display:block;border:0;border-radius:8px;background-color:#ffffff;">
        </td>
    </tr>
</table>
