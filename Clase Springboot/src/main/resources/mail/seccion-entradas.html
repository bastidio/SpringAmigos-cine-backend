<tr>
    <td style="padding:0 32px;">
        <p style="margin:0 0 4px;font-size:12px;letter-spacing:2px;color:#d9b76a;">PELÍCULA</p>
        <h2 style="margin:0 0 16px;font-family:Georgia, 'Times New Roman', serif;font-size:22px;color:#ede6da;">{{pelicula}}</h2>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;">
            <tr>
                <td style="padding:0 8px 0 0;vertical-align:top;">
                    <p style="margin:0;font-size:12px;color:#a89cb0;">Día</p>
                    <p style="margin:4px 0 0;font-size:15px;font-weight:bold;color:#ede6da;">{{dia}}</p>
                </td>
                <td style="padding:0 8px 0 0;vertical-align:top;">
                    <p style="margin:0;font-size:12px;color:#a89cb0;">Hora</p>
                    <p style="margin:4px 0 0;font-size:15px;font-weight:bold;color:#ede6da;">{{hora}} hs</p>
                </td>
                <td style="padding:0 8px 0 0;vertical-align:top;">
                    <p style="margin:0;font-size:12px;color:#a89cb0;">Sala</p>
                    <p style="margin:4px 0 0;font-size:15px;font-weight:bold;color:#ede6da;">{{sala}}</p>
                </td>
            </tr>
        </table>
        <p style="margin:24px 0 12px;font-size:12px;letter-spacing:2px;color:#d9b76a;">TUS ENTRADAS</p>
        {{listaEntradas}}
    </td>
</tr>
<!-- Separador -->
<tr>
    <td style="padding:24px 32px;">
        <div style="height:1px;background-color:#b8913f;opacity:0.4;font-size:0;line-height:0;">&nbsp;</div>
    </td>
</tr>
